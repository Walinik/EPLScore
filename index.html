<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPLS | Чат</title>
    <style>
        body {
            background: #0a1f1a;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #0a191c;
            border-radius: 20px;
            border: 1px solid #2f9d80;
            padding: 20px;
        }
        .hidden { display: none; }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #02221f;
            border: 1px solid #2f9d80;
            border-radius: 12px;
            color: white;
        }
        button {
            background: #1b7b63;
            cursor: pointer;
        }
        .messages {
            height: 300px;
            overflow-y: auto;
            background: #031f1cb3;
            border-radius: 12px;
            padding: 10px;
            margin: 10px 0;
        }
        .message {
            border-left: 3px solid #3bcba0;
            padding: 5px 10px;
            margin-bottom: 8px;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
        }
        .input-area button {
            width: auto;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div id="loginBlock">
        <h2 style="text-align:center; color:#8effdb;">ВХОД</h2>
        <input type="text" id="fullname" placeholder="ФИО">
        <input type="password" id="password" placeholder="Пароль">
        <button id="loginBtn">ВОЙТИ</button>
    </div>

    <div id="chatBlock" class="hidden">
        <div style="display: flex; justify-content: space-between;">
            <span id="userName"></span>
            <button id="logoutBtn">Выйти</button>
        </div>
        <div id="messages" class="messages"></div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Сообщение...">
            <button id="sendBtn">Отправить</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://jwhzfopxfalqhimnbfqw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3aHpmb3B4ZmFscWhpbW5iZnF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMzMyMTUsImV4cCI6MjA5MjYwOTIxNX0.YNhzwTj6MFgRymR0UyE44Ler2B53T-qfMkZqU6xTp4M';
    
    let currentUser = null;
    let refreshInterval = null;

    // Запрос к Supabase
    async function request(endpoint, options = {}) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json'
            },
            ...options
        });
        return res.json();
    }

    // Загрузка сообщений
    async function loadMessages() {
        if (!currentUser) return;
        const messages = await request('chat_messages?select=*&order=timestamp.asc');
        const container = document.getElementById('messages');
        if (!container) return;
        
        if (!messages.length) {
            container.innerHTML = '<div>Нет сообщений</div>';
            return;
        }
        
        container.innerHTML = '';
        messages.forEach(msg => {
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<strong>${msg.author_name}</strong><br>${msg.text}`;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    }

    // Отправка сообщения
    async function sendMessage() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text || !currentUser) return;
        
        await fetch(`${SUPABASE_URL}/rest/v1/chat_messages`, {
            method: 'POST',
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                id: Date.now().toString(),
                room: 'public',
                author_id: currentUser.id,
                author_name: currentUser.display_name || currentUser.full_name,
                text: text,
                is_epls: false,
                timestamp: Date.now()
            })
        });
        
        input.value = '';
        loadMessages();
    }

    // Вход
    async function login() {
        const fullname = document.getElementById('fullname').value.trim();
        const password = document.getElementById('password').value.trim();
        
        if (!fullname || !password) {
            alert('Введите ФИО и пароль');
            return;
        }
        
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = 'ВХОД...';
        
        const employees = await request('employees?select=*');
        const user = employees.find(e => e.full_name === fullname && e.password === password);
        
        if (!user) {
            alert('Неверные данные');
            btn.disabled = false;
            btn.textContent = 'ВОЙТИ';
            return;
        }
        
        currentUser = user;
        if (!currentUser.display_name) currentUser.display_name = currentUser.full_name;
        
        document.getElementById('loginBlock').classList.add('hidden');
        document.getElementById('chatBlock').classList.remove('hidden');
        document.getElementById('userName').innerText = `${currentUser.display_name} (${currentUser.position})`;
        
        loadMessages();
        
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(() => {
            if (currentUser) loadMessages();
        }, 5000);
        
        btn.disabled = false;
        btn.textContent = 'ВОЙТИ';
    }

    function logout() {
        if (refreshInterval) clearInterval(refreshInterval);
        currentUser = null;
        document.getElementById('chatBlock').classList.add('hidden');
        document.getElementById('loginBlock').classList.remove('hidden');
        document.getElementById('fullname').value = '';
        document.getElementById('password').value = '';
    }

    document.getElementById('loginBtn').onclick = login;
    document.getElementById('sendBtn').onclick = sendMessage;
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('msgInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
