<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>EPLS | Чат</title>
    <style>
        body {
            background: radial-gradient(circle at 20% 30%, #0a1f1a, #030c0f);
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #0a191c;
            border-radius: 20px;
            border: 1px solid #2f9d80;
            padding: 20px;
        }
        .hidden { display: none; }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #02221f;
            border: 1px solid #2f9d80;
            border-radius: 12px;
            color: white;
        }
        button {
            background: #1b7b63;
            cursor: pointer;
            font-weight: bold;
        }
        .messages {
            height: 300px;
            overflow-y: auto;
            background: #031f1cb3;
            border-radius: 12px;
            padding: 10px;
            margin: 10px 0;
        }
        .message {
            border-left: 3px solid #3bcba0;
            padding: 5px 10px;
            margin-bottom: 8px;
        }
        .epls-message {
            border-left-color: #ffaa44;
            background: #2a251ab3;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
        }
        .input-area button {
            width: auto;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div id="login">
        <h2 style="text-align:center; color:#8effdb;">ВХОД В СЕТЬ EPLS</h2>
        <input type="text" id="fullname" placeholder="ФИО">
        <input type="password" id="password" placeholder="Пароль">
        <button id="loginBtn">ВОЙТИ</button>
    </div>

    <div id="chat" class="hidden">
        <div style="display: flex; justify-content: space-between;">
            <span id="userName"></span>
            <button id="logoutBtn" style="width: auto;">Выйти</button>
        </div>
        <div style="display: flex; gap: 10px; margin: 10px 0;">
            <button id="eplsToggleBtn" style="background: transparent;">🤖 Режим: Я</button>
        </div>
        <div id="messages" class="messages"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Сообщение...">
            <button id="sendBtn">Отправить</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://jwhzfopxfalqhimnbfqw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3aHpmb3B4ZmFscWhpbW5iZnF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMzMyMTUsImV4cCI6MjA5MjYwOTIxNX0.YNhzwTj6MFgRymR0UyE44Ler2B53T-qfMkZqU6xTp4M';

    let currentUser = null;
    let isEplsMode = false;

    async function request(endpoint, options = {}) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
            headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            ...options
        });
        return res.json();
    }

    async function loadMessages() {
        const messages = await request('chat_messages?select=*&order=timestamp.asc');
        const container = document.getElementById('messages');
        container.innerHTML = '';
        (messages || []).forEach(msg => {
            const div = document.createElement('div');
            div.className = `message ${msg.is_epls ? 'epls-message' : ''}`;
            div.innerHTML = `<strong>${msg.author_name}</strong><br>${msg.text}`;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;

        const authorName = isEplsMode ? (currentUser.epls_name || '🤖 EPLS') : (currentUser.display_name || currentUser.full_name);
        
        await fetch(`${SUPABASE_URL}/rest/v1/chat_messages`, {
            method: 'POST',
            headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                id: Date.now().toString(),
                room: 'public',
                author_id: currentUser.id,
                author_name: authorName,
                text: text,
                is_epls: isEplsMode,
                timestamp: Date.now()
            })
        });
        input.value = '';
        loadMessages();
    }

    async function login() {
        const fullname = document.getElementById('fullname').value.trim();
        const password = document.getElementById('password').value.trim();
        const employees = await request('employees?select=*');
        const user = employees.find(e => e.full_name === fullname && e.password === password);
        if (!user) return alert('Неверные данные');
        
        currentUser = user;
        document.getElementById('login').classList.add('hidden');
        document.getElementById('chat').classList.remove('hidden');
        document.getElementById('userName').innerText = `${currentUser.display_name || currentUser.full_name} | ${currentUser.position}`;
        loadMessages();
    }

    document.getElementById('loginBtn').onclick = login;
    document.getElementById('sendBtn').onclick = sendMessage;
    document.getElementById('logoutBtn').onclick = () => location.reload();
    document.getElementById('eplsToggleBtn').onclick = () => {
        isEplsMode = !isEplsMode;
        document.getElementById('eplsToggleBtn').innerText = isEplsMode ? '🤖 Режим: EPLS' : '🤖 Режим: Я';
    };
    document.getElementById('messageInput').addEventListener('keypress', e => e.key === 'Enter' && sendMessage());
    
    setInterval(() => { if (currentUser) loadMessages(); }, 3000);
</script>
</body>
</html>
