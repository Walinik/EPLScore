<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EPLS | Корпоративная сеть</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a1f1a, #030c0f);
            font-family: 'Segoe UI', 'Courier New', monospace;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: linear-gradient(145deg, #0a191c, #031113);
            border-radius: 24px;
            border: 1px solid rgba(30, 180, 140, 0.5);
            overflow: hidden;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
        }
        .header {
            padding: 15px 20px;
            background: rgba(0, 30, 28, 0.7);
            border-bottom: 1px solid rgba(40, 200, 150, 0.4);
            text-align: center;
        }
        .header h1 {
            background: linear-gradient(135deg, #b0ffea, #3dd68c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            font-size: 1.4rem;
        }
        .content { padding: 20px; }
        
        /* Форма входа */
        .login-form input {
            width: 100%;
            background: #02221f;
            border: 1px solid #2f9d80;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            color: #dcffee;
            font-size: 1rem;
            font-family: monospace;
        }
        .btn {
            background: #1b7b63;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: 0.2s;
        }
        .btn:hover { background: #259e7e; transform: scale(1.01); }
        .btn-secondary {
            background: transparent;
            border: 1px solid #2fa984;
            padding: 6px 12px;
            border-radius: 30px;
            cursor: pointer;
            color: #c0f3e4;
        }
        
        /* Верхняя панель */
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2f9d80;
        }
        .logout-btn {
            background: transparent;
            border: 1px solid #a9452f;
            padding: 6px 20px;
            border-radius: 30px;
            color: #ffb7a4;
            cursor: pointer;
        }
        
        /* Чат */
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        .epls-toggle button {
            background: transparent;
            border: 1px solid #2fa984;
            padding: 5px 15px;
            border-radius: 30px;
            cursor: pointer;
            color: #c0f3e4;
            font-size: 0.75rem;
        }
        .epls-toggle button.active {
            background: #ffaa4422;
            border-color: #ffaa44;
            color: #ffaa44;
        }
        .messages {
            height: 350px;
            overflow-y: auto;
            background: rgba(2, 16, 18, 0.5);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .message {
            background: #031f1cb3;
            border-left: 3px solid #3bcba0;
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 8px;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.epls {
            border-left-color: #ffaa44;
            background: #2a251ab3;
        }
        .message .author {
            font-weight: bold;
            font-size: 0.7rem;
        }
        .message .author.normal { color: #8effdb; }
        .message .author.epls { color: #ffaa44; }
        .message .text {
            color: #e0fff2;
            margin-top: 4px;
            word-break: break-word;
            font-size: 0.9rem;
        }
        .message .time {
            font-size: 0.6rem;
            color: #5aa694;
            margin-left: 8px;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            background: #02221f;
            border: 1px solid #2f9d80;
            padding: 12px;
            border-radius: 28px;
            color: #dcffee;
            font-family: monospace;
        }
        .input-area button {
            width: auto;
            padding: 12px 24px;
        }
        
        /* Настройки */
        .settings-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #2f9d80;
        }
        .settings-section h3 {
            color: #6effcf;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        .settings-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .settings-row input {
            flex: 2;
            background: #02221f;
            border: 1px solid #2f9d80;
            padding: 8px 12px;
            border-radius: 12px;
            color: #dcffee;
        }
        .settings-row button {
            flex: 1;
            white-space: nowrap;
        }
        
        .hidden { display: none; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #0c2628e6;
            border-left: 4px solid #4bffc3;
            backdrop-filter: blur(8px);
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #e1ffef;
            z-index: 1000;
            animation: slideUp 0.2s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .status-led {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.65rem;
            background: #031e1b;
            padding: 3px 10px;
            border-radius: 30px;
            color: #adeee1;
        }
        .led {
            width: 8px;
            height: 8px;
            background-color: #2affb6;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔐 EPLS | Корпоративная сеть</h1>
    </div>
    
    <!-- Форма входа -->
    <div id="loginBlock" class="content">
        <div class="login-form">
            <input type="text" id="loginFullname" placeholder="ФИО" autocomplete="off">
            <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="off">
            <button class="btn" id="loginBtn">ВОЙТИ</button>
            <p style="margin-top: 15px; font-size: 0.7rem; text-align: center; color: #5aa694;">Нет аккаунта? Обратитесь к администратору</p>
        </div>
    </div>
    
    <!-- Основной интерфейс (после входа) -->
    <div id="mainBlock" class="content hidden">
        <!-- Верхняя панель -->
        <div class="user-bar">
            <span id="userNameDisplay" style="color:#8effdb;">👤 Загрузка...</span>
            <button class="logout-btn" id="logoutBtn">🚪 Выйти</button>
        </div>
        
        <!-- Чат -->
        <div class="chat-header">
            <div class="status-led"><span class="led"></span> ОНЛАЙН</div>
            <div class="epls-toggle">
                <button id="eplsModeBtn">👤 Писать как: Я</button>
            </div>
        </div>
        
        <div id="messages" class="messages">
            <div style="text-align:center; padding:20px;">Загрузка сообщений...</div>
        </div>
        
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Введите сообщение...">
            <button class="btn" id="sendBtn" style="width: auto;">➤ Отправить</button>
        </div>
        
        <!-- Настройки -->
        <div class="settings-section">
            <h3>⚙️ НАСТРОЙКИ ОТОБРАЖЕНИЯ</h3>
            <div class="settings-row">
                <input type="text" id="displayNameInput" placeholder="Ваше имя в чате">
                <button id="updateNameBtn" class="btn-secondary">💾 Сохранить</button>
            </div>
            <div id="eplsNameRow" class="settings-row" style="margin-top: 10px;">
                <input type="text" id="eplsNameInput" placeholder="Имя бота EPLS">
                <button id="updateEplsNameBtn" class="btn-secondary">🤖 Сохранить</button>
            </div>
        </div>
        
        <!-- Смена пароля -->
        <div class="settings-section">
            <h3>🔑 БЕЗОПАСНОСТЬ</h3>
            <div class="settings-row">
                <input type="password" id="newPasswordInput" placeholder="Новый пароль">
                <button id="changePasswordBtn" class="btn-secondary">Сменить пароль</button>
            </div>
        </div>
        
        <!-- Админ-панель (только для администраторов) -->
        <div id="adminPanel" class="settings-section hidden">
            <h3>👑 АДМИН-ПАНЕЛЬ</h3>
            <div style="margin-bottom: 15px;">
                <h4 style="color:#7adbc2; font-size:0.8rem;">➕ Новый сотрудник</h4>
                <div class="settings-row" style="margin-bottom: 10px;">
                    <input type="text" id="regFullname" placeholder="ФИО">
                    <input type="text" id="regPosition" placeholder="Должность">
                    <input type="password" id="regPassword" placeholder="Пароль">
                    <select id="regLevel" style="background:#02221f; border:1px solid #2f9d80; padding:8px; border-radius:12px;">
                        <option value="1">Ур.1</option><option value="2">Ур.2</option><option value="3">Ур.3</option>
                        <option value="4">Ур.4</option><option value="5">Ур.5</option>
                    </select>
                </div>
                <button id="registerBtn" class="btn-secondary" style="width:100%;">➕ ДОБАВИТЬ</button>
            </div>
            
            <h4 style="color:#7adbc2; font-size:0.8rem;">👥 Список сотрудников</h4>
            <div style="overflow-x: auto; max-height: 300px; overflow-y: auto;">
                <table style="width:100%; border-collapse: collapse; font-size:0.7rem;">
                    <thead><tr style="color:#6effcf;"><th>ФИО</th><th>Должность</th><th>Имя в чате</th><th>Уровень</th><th>Админ</th><th></th></tr></thead>
                    <tbody id="empTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== КОНФИГУРАЦИЯ SUPABASE =====
    const SUPABASE_URL = 'https://jwhzfopxfalqhimnbfqw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3aHpmb3B4ZmFscWhpbW5iZnF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMzMyMTUsImV4cCI6MjA5MjYwOTIxNX0.YNhzwTj6MFgRymR0UyE44Ler2B53T-qfMkZqU6xTp4M';
    
    let currentUser = null;
    let isEplsMode = false;
    let refreshInterval = null;
    let employees = [];
    
    // ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====
    function showToast(msg, isErr = false) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = isErr ? '#ff7a5e' : '#4bffc3';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }
    
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    
    // ===== ЗАПРОСЫ К SUPABASE =====
    async function supabaseFetch(endpoint) {
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        } catch(e) { console.error('Fetch error:', e); return []; }
    }
    
    async function supabasePost(endpoint, body) {
        return fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
    }
    
    async function supabasePatch(endpoint, id, body) {
        return fetch(`${SUPABASE_URL}/rest/v1/${endpoint}?id=eq.${id}`, {
            method: 'PATCH',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
    }
    
    // ===== ЧАТ =====
    async function loadMessages() {
        if (!currentUser) return;
        const messages = await supabaseFetch('chat_messages?select=*&order=timestamp.asc');
        const container = document.getElementById('messages');
        if (!container) return;
        if (!messages || !messages.length) {
            container.innerHTML = '<div style="text-align:center; padding:20px;">Нет сообщений. Напишите что-нибудь!</div>';
            return;
        }
        container.innerHTML = '';
        messages.forEach(msg => {
            const div = document.createElement('div');
            div.className = `message ${msg.is_epls ? 'epls' : ''}`;
            const time = new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            div.innerHTML = `
                <div class="author ${msg.is_epls ? 'epls' : 'normal'}">${escapeHtml(msg.author_name)} <span class="time">${time}</span></div>
                <div class="text">${escapeHtml(msg.text)}</div>
            `;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    }
    
    async function sendMessage() {
        const text = document.getElementById('msgInput').value.trim();
        if (!text) return;
        
        const authorName = isEplsMode ? (currentUser.epls_name || '🤖 EPLS') : (currentUser.display_name || currentUser.full_name);
        
        const newMsg = {
            id: Date.now().toString(),
            room: 'public',
            author_id: currentUser.id,
            author_name: authorName,
            text: text,
            is_epls: isEplsMode,
            timestamp: Date.now()
        };
        
        const response = await supabasePost('chat_messages', newMsg);
        if (response.ok) {
            document.getElementById('msgInput').value = '';
            await loadMessages();
        } else {
            showToast("Ошибка отправки", true);
        }
    }
    
    // ===== НАСТРОЙКИ =====
    async function updateDisplayName() {
        const newName = document.getElementById('displayNameInput').value.trim();
        if (!newName) { showToast("Введите имя", true); return; }
        const response = await supabasePatch('employees', currentUser.id, { display_name: newName });
        if (response.ok) {
            currentUser.display_name = newName;
            document.getElementById('userNameDisplay').innerHTML = `👤 ${currentUser.display_name} | ${currentUser.position} | Уровень ${currentUser.level}`;
            showToast(`Имя изменено на "${newName}"`);
        } else { showToast("Ошибка", true); }
    }
    
    async function updateEplsName() {
        const newName = document.getElementById('eplsNameInput').value.trim();
        if (!newName) { showToast("Введите имя бота", true); return; }
        const response = await supabasePatch('employees', currentUser.id, { epls_name: newName });
        if (response.ok) {
            currentUser.epls_name = newName;
            showToast(`Имя EPLS изменено на "${newName}"`);
        } else { showToast("Ошибка", true); }
    }
    
    async function changePassword() {
        const newPwd = document.getElementById('newPasswordInput').value.trim();
        if (!newPwd) { showToast("Введите новый пароль", true); return; }
        const response = await supabasePatch('employees', currentUser.id, { password: newPwd });
        if (response.ok) {
            showToast("Пароль изменён");
            document.getElementById('newPasswordInput').value = '';
        } else { showToast("Ошибка", true); }
    }
    
    // ===== АДМИН-ФУНКЦИИ =====
    async function loadEmployeesForAdmin() {
        if (!currentUser?.is_admin) return;
        const data = await supabaseFetch('employees?select=*');
        if (data && data.length) {
            employees = data;
            renderAdminTable();
        }
    }
    
    function renderAdminTable() {
        const tbody = document.getElementById('empTableBody');
        if (!tbody) return;
        if (!employees.length) { tbody.innerHTML = '<tr><td colspan="6">Нет сотрудников</td></tr>'; return; }
        tbody.innerHTML = '';
        employees.forEach(emp => {
            if (emp.id === currentUser.id) return;
            const row = tbody.insertRow();
            row.insertCell(0).innerHTML = `<input type="text" id="name_${emp.id}" value="${escapeHtml(emp.full_name)}" style="width:100px;">`;
            row.insertCell(1).innerHTML = `<input type="text" id="pos_${emp.id}" value="${escapeHtml(emp.position)}" style="width:100px;">`;
            row.insertCell(2).innerHTML = `<input type="text" id="disp_${emp.id}" value="${escapeHtml(emp.display_name || emp.full_name)}" style="width:100px;">`;
            const lvlCell = row.insertCell(3);
            const lvlSel = document.createElement('select');
            for (let i=1;i<=5;i++) { let o=document.createElement('option'); o.value=i; o.textContent=i; if(emp.level==i) o.selected=true; lvlSel.appendChild(o); }
            lvlSel.id = `lvl_${emp.id}`;
            lvlCell.appendChild(lvlSel);
            const adminCell = row.insertCell(4);
            const chk = document.createElement('input'); chk.type='checkbox'; chk.checked = emp.is_admin === true;
            chk.id = `admin_${emp.id}`;
            adminCell.appendChild(chk);
            const actCell = row.insertCell(5);
            const saveBtn = document.createElement('button'); saveBtn.textContent='💾'; saveBtn.style.background='transparent'; saveBtn.style.border='1px solid #2fa984'; saveBtn.style.borderRadius='14px'; saveBtn.style.padding='3px 8px'; saveBtn.style.cursor='pointer';
            saveBtn.onclick = async () => {
                await supabasePatch('employees', emp.id, {
                    full_name: document.getElementById(`name_${emp.id}`).value,
                    position: document.getElementById(`pos_${emp.id}`).value,
                    display_name: document.getElementById(`disp_${emp.id}`).value,
                    level: parseInt(document.getElementById(`lvl_${emp.id}`).value),
                    is_admin: document.getElementById(`admin_${emp.id}`).checked
                });
                showToast(`✅ ${emp.full_name} обновлён`);
                await loadEmployeesForAdmin();
            };
            actCell.appendChild(saveBtn);
        });
    }
    
    async function registerEmployee() {
        const full = document.getElementById('regFullname').value.trim();
        const pos = document.getElementById('regPosition').value.trim();
        const pwd = document.getElementById('regPassword').value.trim();
        const lvl = document.getElementById('regLevel').value;
        if (!full || !pos || !pwd) { showToast("Заполните все поля", true); return; }
        if (employees.find(e => e.full_name === full)) { showToast("Сотрудник уже существует", true); return; }
        const newEmp = {
            id: Date.now().toString(),
            full_name: full,
            position: pos,
            password: pwd,
            level: parseInt(lvl),
            is_admin: false,
            display_name: full,
            epls_name: '🤖 EPLS'
        };
        const response = await supabasePost('employees', newEmp);
        if (response.ok) {
            showToast(`✅ ${full} добавлен`);
            document.getElementById('regFullname').value = '';
            document.getElementById('regPosition').value = '';
            document.getElementById('regPassword').value = '';
            await loadEmployeesForAdmin();
        } else { showToast("Ошибка добавления", true); }
    }
    
    // ===== ВХОД =====
    async function login() {
        const fullname = document.getElementById('loginFullname').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        if (!fullname || !password) { showToast("Введите ФИО и пароль", true); return; }
        
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = 'ВХОД...';
        
        const data = await supabaseFetch('employees?select=*');
        const user = data.find(e => e.full_name === fullname && e.password === password);
        
        if (!user) {
            showToast("Неверные ФИО или пароль", true);
            btn.disabled = false;
            btn.textContent = 'ВОЙТИ';
            return;
        }
        
        currentUser = user;
        if (!currentUser.display_name) currentUser.display_name = currentUser.full_name;
        if (!currentUser.epls_name) currentUser.epls_name = '🤖 EPLS';
        
        document.getElementById('loginBlock').classList.add('hidden');
        document.getElementById('mainBlock').classList.remove('hidden');
        document.getElementById('userNameDisplay').innerHTML = `👤 ${currentUser.display_name} | ${currentUser.position} | Уровень ${currentUser.level}`;
        document.getElementById('displayNameInput').value = currentUser.display_name;
        document.getElementById('eplsNameInput').value = currentUser.epls_name;
        
        const isAdmin = currentUser.is_admin === true;
        document.getElementById('adminPanel').classList.toggle('hidden', !isAdmin);
        document.getElementById('eplsNameRow').classList.toggle('hidden', !isAdmin);
        
        if (isAdmin) {
            await loadEmployeesForAdmin();
        }
        
        await loadMessages();
        startAutoRefresh();
        
        btn.disabled = false;
        btn.textContent = 'ВОЙТИ';
    }
    
    function startAutoRefresh() {
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(() => {
            if (currentUser) {
                loadMessages();
                if (currentUser.is_admin) loadEmployeesForAdmin();
            }
        }, 5000);
    }
    
    function logout() {
        if (refreshInterval) clearInterval(refreshInterval);
        currentUser = null;
        document.getElementById('mainBlock').classList.add('hidden');
        document.getElementById('loginBlock').classList.remove('hidden');
        document.getElementById('loginFullname').value = '';
        document.getElementById('loginPassword').value = '';
    }
    
    // ===== ОБРАБОТЧИКИ =====
    document.getElementById('loginBtn').onclick = login;
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('sendBtn').onclick = sendMessage;
    document.getElementById('msgInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    document.getElementById('updateNameBtn').onclick = updateDisplayName;
    document.getElementById('updateEplsNameBtn').onclick = updateEplsName;
    document.getElementById('changePasswordBtn').onclick = changePassword;
    document.getElementById('registerBtn').onclick = registerEmployee;
    
    document.getElementById('eplsModeBtn').onclick = () => {
        isEplsMode = !isEplsMode;
        const btn = document.getElementById('eplsModeBtn');
        if (isEplsMode) {
            btn.innerHTML = '🤖 Писать как: EPLS';
            btn.classList.add('active');
        } else {
            btn.innerHTML = '👤 Писать как: Я';
            btn.classList.remove('active');
        }
        showToast(isEplsMode ? 'Вы пишете от имени EPLS' : 'Вы пишете от своего имени');
    };
</script>
</body>
</html>
