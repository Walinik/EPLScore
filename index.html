<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EPLS | Корпоративная сеть</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: radial-gradient(circle at 20% 30%, #0a1f1a, #030c0f); font-family: 'Segoe UI', 'Courier New', monospace; padding: 1.5rem; }
        .dashboard { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
        .card { background: linear-gradient(145deg, #0a191c, #031113); border-radius: 1.5rem; border: 1px solid rgba(30, 180, 140, 0.5); overflow: hidden; }
        .card-header { padding: 0.8rem 1.5rem; background: rgba(0, 30, 28, 0.7); border-bottom: 1px solid rgba(40, 200, 150, 0.4); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .card-header h2 { font-size: 1.1rem; background: linear-gradient(135deg, #b0ffea, #3dd68c); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .badge-led { display: flex; align-items: center; gap: 8px; font-size: 0.65rem; background: #031e1b; padding: 4px 12px; border-radius: 30px; color: #adeee1; }
        .led { width: 9px; height: 9px; background-color: #2affb6; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.4; } 100% { opacity: 1; } }
        .card-content { padding: 1.2rem 1.5rem; }
        .login-form { max-width: 400px; margin: 0 auto; text-align: center; }
        .login-form input { width: 100%; background: #02221f; border: 1px solid #2f9d80; padding: 12px; border-radius: 14px; font-size: 1rem; color: #dcffee; margin-bottom: 1rem; }
        .user-info { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logout-btn { background: transparent; border: 1px solid #a9452f; padding: 5px 15px; border-radius: 20px; color: #ffb7a4; cursor: pointer; }
        .reg-grid { display: flex; flex-wrap: wrap; gap: 0.8rem; }
        .reg-field { flex: 1; min-width: 150px; }
        .reg-field label { font-size: 0.6rem; color: #7adbc2; display: block; margin-bottom: 4px; }
        .reg-field input, .reg-field select { width: 100%; background: #02221f; border: 1px solid #2f9d80; padding: 8px 10px; border-radius: 12px; font-size: 0.85rem; color: #dcffee; }
        .btn-primary { background: #1b7b63b3; border: 1px solid #5cefc2; padding: 10px 20px; border-radius: 40px; font-weight: bold; color: #f0fff5; cursor: pointer; width: 100%; }
        .employees-table-wrapper { overflow-x: auto; }
        .emp-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        .emp-table th, .emp-table td { padding: 8px 5px; text-align: left; border-bottom: 1px solid #1d6b5a; color: #d2f0e6; }
        .emp-table th { color: #6effcf; font-size: 0.65rem; }
        .emp-table input, .emp-table select { background: #02221f; border: 1px solid #2f9d80; padding: 4px 6px; border-radius: 10px; color: #dcffee; width: 100%; min-width: 80px; font-size: 0.7rem; }
        .save-user-btn, .delete-btn { background: transparent; border: 1px solid #2fa984; padding: 3px 8px; border-radius: 14px; font-size: 0.6rem; color: #c0f3e4; cursor: pointer; margin: 2px; }
        .delete-btn { border-color: #a9452f; color: #ffb7a4; }
        .chat-messages { height: 250px; overflow-y: auto; padding: 0.8rem; background: rgba(2, 16, 18, 0.4); border-radius: 1rem; font-size: 0.8rem; }
        .message { background: #031f1cb3; border-left: 3px solid #3bcba0; border-radius: 10px; padding: 6px 10px; margin-bottom: 6px; }
        .message .author { color: #8effdb; font-weight: bold; font-size: 0.65rem; }
        .message .text { color: #e0fff2; margin-top: 3px; word-break: break-word; }
        .chat-input-area { display: flex; gap: 8px; padding: 0.8rem; border-top: 1px solid #2f7a6a; }
        .chat-input { flex: 1; background: #02221f; border: 1px solid #2f9d80; padding: 8px 12px; border-radius: 28px; color: #dcffee; }
        .chat-send { background: #1b7b63b3; border: none; padding: 0 20px; border-radius: 40px; color: white; cursor: pointer; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #0c2628e6; border-left: 4px solid #4bffc3; border-radius: 20px; padding: 8px 20px; font-size: 0.75rem; color: #e1ffef; z-index: 1200; }
        .author-bar { display: flex; justify-content: flex-end; gap: 10px; align-items: center; margin-bottom: 8px; }
        .change-author-btn { background: transparent; border: 1px solid #2fa984; padding: 3px 10px; border-radius: 30px; font-size: 0.55rem; color: #bbf0e0; cursor: pointer; }
        .hidden { display: none; }
        .loading { text-align: center; padding: 20px; color: #5aa694; }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="card" id="loginCard">
        <div class="card-header"><h2>🔐 ВХОД В СЕТЬ EPLS</h2><div class="badge-led"><span class="led"></span> КОРПОРАТИВНАЯ СЕТЬ</div></div>
        <div class="card-content">
            <div class="login-form">
                <input type="text" id="loginFullname" placeholder="ФИО" autocomplete="off">
                <input type="password" id="loginPassword" placeholder="Пароль">
                <button class="btn-primary" id="loginBtn">ВОЙТИ</button>
                <div style="margin-top: 1rem; font-size: 0.7rem; color: #5aa694;">Нет аккаунта? Обратитесь к администратору</div>
            </div>
        </div>
    </div>

    <div id="mainInterface" class="hidden">
        <div class="card"><div class="card-header"><h2>📋 ПАНЕЛЬ УПРАВЛЕНИЯ</h2><div class="user-info" id="userInfo"></div></div></div>

        <div class="card">
            <div class="card-header"><h2>💬 ЧАТ ЗАПРОСОВ</h2><div class="badge-led"><span class="led"></span> ОНЛАЙН</div></div>
            <div class="card-content">
                <div class="author-bar"><span style="font-size:0.6rem;">Ваше имя:</span><span id="currentAuthorName" style="color:#8effdb;">—</span><button class="change-author-btn" id="changeAuthorBtn">🔄 Сменить</button></div>
                <div id="chatMessages" class="chat-messages"><div class="loading">Загрузка...</div></div>
                <div class="chat-input-area"><input type="text" id="chatInput" class="chat-input" placeholder="Сообщение..."><button id="sendChatBtn" class="chat-send">➤</button></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><h2>🔑 СМЕНА ПАРОЛЯ</h2><div class="badge-led"><span class="led"></span> БЕЗОПАСНОСТЬ</div></div>
            <div class="card-content">
                <div class="reg-grid">
                    <div class="reg-field" style="flex:2"><input type="password" id="newPassword" placeholder="Новый пароль"></div>
                    <div class="reg-field"><button class="btn-primary" id="changePasswordBtn" style="margin-top:0;">СМЕНИТЬ</button></div>
                </div>
            </div>
        </div>

        <div id="adminPanel" class="hidden">
            <div class="card">
                <div class="card-header"><h2>👑 АДМИН-ПАНЕЛЬ</h2><div class="badge-led"><span class="led"></span> ПОЛНЫЙ ДОСТУП</div></div>
                <div class="card-content employees-table-wrapper">
                    <table class="emp-table"><thead><tr><th>ФИО</th><th>Должность</th><th>Пароль</th><th>Уровень</th><th>Админ</th><th>Действия</th></tr></thead><tbody id="empTableBody"><tr><td colspan="6" class="loading">Загрузка...</td></tr></tbody>追逐
                </div>
            </div>
            <div class="card">
                <div class="card-header"><h2>➕ НОВЫЙ СОТРУДНИК</h2><div class="badge-led"><span class="led"></span> АДМИН</div></div>
                <div class="card-content">
                    <div class="reg-grid">
                        <div class="reg-field"><input type="text" id="regFullname" placeholder="ФИО"></div>
                        <div class="reg-field"><input type="text" id="regPosition" placeholder="Должность"></div>
                        <div class="reg-field"><input type="password" id="regPassword" placeholder="Пароль"></div>
                        <div class="reg-field"><select id="regLevel"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
                        <div class="reg-field"><button class="btn-primary" id="registerBtn">➕ ДОБАВИТЬ</button></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== ВАШИ ДАННЫЕ ИЗ SUPABASE (БЕЗ ПРОБЕЛОВ!) =====
    const SUPABASE_URL = 'https://jwhzfopxfalqhimnbfqw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3aHpmb3B4ZmFscWhpbW5iZnF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMzMyMTUsImV4cCI6MjA5MjYwOTIxNX0.YNhzwTj6MFgRymR0UyE44Ler2B53T-qfMkZqU6xTp4M';
    
    let employees = [];
    let chatMessages = [];
    let currentUser = null;
    let currentChatAuthor = localStorage.getItem('epls_chat_author') || "";

    async function supabaseFetch(endpoint) {
        try {
            const url = `${SUPABASE_URL}/rest/v1/${endpoint}`;
            const response = await fetch(url, {
                headers: { 
                    'apikey': SUPABASE_KEY, 
                    'Authorization': `Bearer ${SUPABASE_KEY}` 
                }
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
        } catch(e) { 
            console.warn('fetch error:', e); 
            showToast("Ошибка соединения с сервером", true);
            return []; 
        }
    }

    async function supabasePost(endpoint, body) {
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
                method: 'POST',
                headers: { 
                    'apikey': SUPABASE_KEY, 
                    'Authorization': `Bearer ${SUPABASE_KEY}`, 
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify(body)
            });
            return response;
        } catch(e) { console.warn('post error:', e); return null; }
    }

    async function supabasePatch(endpoint, id, body) {
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}?id=eq.${id}`, {
                method: 'PATCH',
                headers: { 
                    'apikey': SUPABASE_KEY, 
                    'Authorization': `Bearer ${SUPABASE_KEY}`, 
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify(body)
            });
            return response;
        } catch(e) { console.warn('patch error:', e); return null; }
    }

    async function supabaseDelete(endpoint, id) {
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}?id=eq.${id}`, {
                method: 'DELETE',
                headers: { 
                    'apikey': SUPABASE_KEY, 
                    'Authorization': `Bearer ${SUPABASE_KEY}` 
                }
            });
            return response;
        } catch(e) { console.warn('delete error:', e); return null; }
    }

    async function fetchEmployees() {
        const data = await supabaseFetch('employees?select=*');
        if (data && data.length) { employees = data; renderAdminTable(); }
        return employees;
    }

    async function fetchChat() {
        const data = await supabaseFetch('chat?select=*&order=timestamp.asc');
        if (data && data.length) { chatMessages = data; renderChat(); }
        return chatMessages;
    }

    function renderChat() {
        const container = document.getElementById('chatMessages');
        if (!container) return;
        if (!chatMessages.length) { container.innerHTML = '<div class="loading">Нет сообщений</div>'; return; }
        container.innerHTML = '';
        chatMessages.forEach(msg => {
            const div = document.createElement('div');
            div.className = 'message';
            const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
            div.innerHTML = `<div class="author">${escapeHtml(msg.author)} <span style="color:#5a9e8a;">${time}</span></div><div class="text">${escapeHtml(msg.text)}</div>`;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
        const text = document.getElementById('chatInput').value.trim();
        if (!text) return;
        const newMsg = { id: Date.now().toString(), author: currentChatAuthor, text: text, timestamp: Date.now() };
        const response = await supabasePost('chat', newMsg);
        if (response && response.ok) { 
            document.getElementById('chatInput').value = ''; 
            await fetchChat(); 
        } else showToast("Ошибка отправки", true);
    }

    async function changePassword() {
        const newPwd = document.getElementById('newPassword').value.trim();
        if (!newPwd) { showToast("Введите новый пароль", true); return; }
        const response = await supabasePatch('employees', currentUser.id, { password: newPwd });
        if (response && response.ok) {
            showToast("Пароль изменён");
            document.getElementById('newPassword').value = '';
            currentUser.password = newPwd;
        } else showToast("Ошибка смены пароля", true);
    }

    async function registerEmployee() {
        const full = document.getElementById('regFullname').value.trim();
        const pos = document.getElementById('regPosition').value.trim();
        const pwd = document.getElementById('regPassword').value.trim();
        const lvl = document.getElementById('regLevel').value;
        if (!full || !pos || !pwd) { showToast("Заполните все поля", true); return; }
        if (employees.find(e => e.full_name === full)) { showToast("Сотрудник уже существует", true); return; }
        const newEmp = { id: Date.now().toString(), full_name: full, position: pos, password: pwd, level: parseInt(lvl), is_admin: false };
        const response = await supabasePost('employees', newEmp);
        if (response && response.ok) {
            showToast(`✅ ${full} добавлен`);
            document.getElementById('regFullname').value = '';
            document.getElementById('regPosition').value = '';
            document.getElementById('regPassword').value = '';
            await fetchEmployees();
        } else showToast("Ошибка добавления", true);
    }

    async function updateEmployee(id, full_name, position, password, level, is_admin) {
        const emp = employees.find(e => e.id === id);
        if (!emp) return;
        if (emp.full_name === "Системный Администратор" && is_admin === false) { showToast("Нельзя снять админку с главного администратора", true); return; }
        const response = await supabasePatch('employees', id, { full_name, position, password, level: parseInt(level), is_admin });
        if (response && response.ok) { showToast(`✅ Обновлён`); await fetchEmployees(); }
        else showToast("Ошибка обновления", true);
    }

    async function deleteEmployee(id) {
        const emp = employees.find(e => e.id === id);
        if (!emp) return;
        if (emp.full_name === "Системный Администратор") { showToast("Нельзя удалить главного администратора", true); return; }
        if (confirm(`Удалить ${emp.full_name}?`)) {
            const response = await supabaseDelete('employees', id);
            if (response && response.ok) { showToast(`🗑️ Удалён`); await fetchEmployees(); }
            else showToast("Ошибка удаления", true);
        }
    }

    function renderAdminTable() {
        const tbody = document.getElementById('empTableBody');
        if (!tbody) return;
        if (!employees.length) { tbody.innerHTML = '<tr><td colspan="6" class="loading">Нет сотрудников</td></tr>'; return; }
        tbody.innerHTML = '';
        employees.forEach(emp => {
            const row = tbody.insertRow();
            const nameCell = row.insertCell(0); const nameInp = document.createElement('input'); nameInp.value = emp.full_name;
            const posCell = row.insertCell(1); const posInp = document.createElement('input'); posInp.value = emp.position;
            const pwdCell = row.insertCell(2); const pwdInp = document.createElement('input'); pwdInp.type = 'password'; pwdInp.value = emp.password;
            const lvlCell = row.insertCell(3); const lvlSel = document.createElement('select');
            for (let i=1;i<=5;i++) { let o=document.createElement('option'); o.value=i; o.textContent=i; if(emp.level==i) o.selected=true; lvlSel.appendChild(o); }
            const adminCell = row.insertCell(4); const chk = document.createElement('input'); chk.type='checkbox'; chk.checked = emp.is_admin === true;
            const actCell = row.insertCell(5);
            const saveBtn = document.createElement('button'); saveBtn.textContent='💾'; saveBtn.className='save-user-btn';
            saveBtn.onclick = () => updateEmployee(emp.id, nameInp.value, posInp.value, pwdInp.value, lvlSel.value, chk.checked);
            const delBtn = document.createElement('button'); delBtn.textContent='🗑️'; delBtn.className='delete-btn';
            delBtn.onclick = () => deleteEmployee(emp.id);
            if(emp.full_name === "Системный Администратор") delBtn.disabled=true;
            actCell.appendChild(saveBtn); actCell.appendChild(delBtn);
            nameCell.appendChild(nameInp); posCell.appendChild(posInp); pwdCell.appendChild(pwdInp);
            lvlCell.appendChild(lvlSel); adminCell.appendChild(chk);
        });
    }

    async function login() {
        const fullname = document.getElementById('loginFullname').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        if (!fullname || !password) { showToast("Введите ФИО и пароль", true); return; }
        document.getElementById('loginBtn').disabled = true;
        document.getElementById('loginBtn').textContent = 'ВХОД...';
        await fetchEmployees();
        const user = employees.find(e => e.full_name === fullname && e.password === password);
        if (!user) { showToast("Неверные ФИО или пароль", true); document.getElementById('loginBtn').disabled = false; document.getElementById('loginBtn').textContent = 'ВОЙТИ'; return; }
        currentUser = user;
        currentChatAuthor = currentUser.full_name;
        localStorage.setItem('epls_chat_author', currentChatAuthor);
        document.getElementById('currentAuthorName').innerText = currentChatAuthor;
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('mainInterface').classList.remove('hidden');
        document.getElementById('userInfo').innerHTML = `<span>👤 ${currentUser.full_name} | ${currentUser.position} | Уровень ${currentUser.level}</span><button class="logout-btn" id="logoutBtn">🚪 Выйти</button>`;
        document.getElementById('logoutBtn').onclick = () => { currentUser = null; document.getElementById('mainInterface').classList.add('hidden'); document.getElementById('loginCard').classList.remove('hidden'); };
        const isAdmin = currentUser.is_admin === true;
        document.getElementById('adminPanel').classList.toggle('hidden', !isAdmin);
        if (isAdmin) renderAdminTable();
        await fetchChat();
        startAutoRefresh();
        document.getElementById('loginBtn').disabled = false;
        document.getElementById('loginBtn').textContent = 'ВОЙТИ';
    }

    let refreshInterval = null;
    function startAutoRefresh() {
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(() => { if (currentUser) { fetchChat(); if (currentUser.is_admin) fetchEmployees(); } }, 8000);
    }

    function showToast(msg, isErr = false) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = isErr ? '#ff7a5e' : '#4bffc3';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    document.getElementById('loginBtn').onclick = login;
    document.getElementById('sendChatBtn').onclick = sendMessage;
    document.getElementById('chatInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    document.getElementById('changePasswordBtn').onclick = changePassword;
    document.getElementById('registerBtn').onclick = registerEmployee;
    document.getElementById('changeAuthorBtn').onclick = () => {
        const newName = prompt("Новое имя в чате:", currentChatAuthor);
        if (newName && newName.trim()) { currentChatAuthor = newName.trim(); localStorage.setItem('epls_chat_author', currentChatAuthor); document.getElementById('currentAuthorName').innerText = currentChatAuthor; showToast(`Имя изменено на ${currentChatAuthor}`); }
    };

    // Загружаем данные при старте
    fetchEmployees();
    fetchChat();
</script>
</body>
</html>
