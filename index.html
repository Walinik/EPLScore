<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EPLS | Сеть сотрудников</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a1f1a, #030c0f);
            font-family: 'Segoe UI', 'Courier New', monospace;
            padding: 1.5rem;
        }
        .dashboard { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
        .card {
            background: linear-gradient(145deg, #0a191c, #031113);
            border-radius: 1.8rem;
            border: 1px solid rgba(30, 180, 140, 0.5);
            overflow: hidden;
        }
        .card-header {
            padding: 1rem 1.8rem;
            background: rgba(0, 30, 28, 0.7);
            border-bottom: 1px solid rgba(40, 200, 150, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .card-header h2 {
            font-size: 1.2rem;
            background: linear-gradient(135deg, #b0ffea, #3dd68c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .badge-led {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            background: #031e1b;
            padding: 4px 12px;
            border-radius: 30px;
            color: #adeee1;
        }
        .led {
            width: 9px;
            height: 9px;
            background-color: #2affb6;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.4; } 100% { opacity: 1; } }
        .card-content { padding: 1.5rem 1.8rem; }
        .reg-grid { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 0.5rem; }
        .reg-field { flex: 1; min-width: 180px; }
        .reg-field label { font-size: 0.65rem; color: #7adbc2; display: block; margin-bottom: 4px; }
        .reg-field input {
            width: 100%;
            background: #02221f;
            border: 1px solid #2f9d80;
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 0.9rem;
            color: #dcffee;
            outline: none;
        }
        .btn-primary {
            background: #1b7b63b3;
            border: 1px solid #5cefc2;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            color: #f0fff5;
            cursor: pointer;
            width: 100%;
        }
        .employees-table-wrapper { overflow-x: auto; }
        .emp-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .emp-table th, .emp-table td { padding: 12px 8px; text-align: left; border-bottom: 1px solid #1d6b5a; color: #d2f0e6; }
        .emp-table th { color: #6effcf; font-size: 0.7rem; }
        .level-select {
            background: #02221f;
            border: 1px solid #2f9d80;
            padding: 6px 8px;
            border-radius: 20px;
            color: #dcffee;
            width: 70px;
        }
        .admin-checkbox { transform: scale(1.1); accent-color: #2affb6; cursor: pointer; }
        .save-level-btn, .delete-btn {
            background: transparent;
            border: 1px solid #2fa984;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            color: #c0f3e4;
            cursor: pointer;
            margin-right: 5px;
        }
        .delete-btn { border-color: #a9452f; color: #ffb7a4; }
        .role-badge { background: #0f2f2a; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; }
        .chat-messages {
            height: 280px;
            overflow-y: auto;
            padding: 0.8rem;
            background: rgba(2, 16, 18, 0.4);
            border-radius: 1rem;
        }
        .message {
            background: #031f1cb3;
            border-left: 3px solid #3bcba0;
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 8px;
        }
        .message .author { color: #8effdb; font-weight: bold; font-size: 0.7rem; }
        .message .text { color: #e0fff2; margin-top: 4px; }
        .chat-input-area { display: flex; gap: 8px; padding: 0.8rem; border-top: 1px solid #2f7a6a; }
        .chat-input {
            flex: 1;
            background: #02221f;
            border: 1px solid #2f9d80;
            padding: 10px 12px;
            border-radius: 28px;
            color: #dcffee;
            outline: none;
        }
        .chat-send {
            background: #1b7b63b3;
            border: none;
            padding: 0 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #0c2628e6;
            border-left: 4px solid #4bffc3;
            border-radius: 20px;
            padding: 10px 22px;
            font-size: 0.8rem;
            color: #e1ffef;
            z-index: 1200;
        }
        .author-bar { display: flex; justify-content: flex-end; gap: 10px; align-items: center; margin-bottom: 10px; }
        .change-author-btn {
            background: transparent;
            border: 1px solid #2fa984;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.6rem;
            color: #bbf0e0;
            cursor: pointer;
        }
        @media (max-width: 850px) { .card-content { padding: 1rem; } }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="card">
        <div class="card-header">
            <h2>🔐 РЕГИСТРАЦИЯ В СЕТИ EPLS</h2>
            <div class="badge-led"><span class="led"></span> ОБЩАЯ СЕТЬ</div>
        </div>
        <div class="card-content">
            <div class="reg-grid">
                <div class="reg-field"><label>ФИО</label><input type="text" id="regFullname" placeholder="Иванов Иван Иванович"></div>
                <div class="reg-field"><label>ДОЛЖНОСТЬ</label><input type="text" id="regPosition" placeholder="Инженер, Оператор..."></div>
                <div class="reg-field"><label>ПАРОЛЬ</label><input type="password" id="regPassword" placeholder="секретный ключ"></div>
            </div>
            <button class="btn-primary" id="registerBtn">➕ ДОБАВИТЬ В СЕТЬ</button>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>👥 СОТРУДНИКИ | Уровни 1-5</h2>
            <div class="badge-led"><span class="led"></span> АДМИН-ПАНЕЛЬ</div>
        </div>
        <div class="card-content employees-table-wrapper">
            <table class="emp-table" id="empTable"><thead><tr><th>ФИО</th><th>Должность</th><th>Уровень</th><th>Админ</th><th>Действия</th></tr></thead><tbody id="empTableBody"></tbody></table>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>💬 ЧАТ ЗАПРОСОВ</h2>
            <div class="badge-led"><span class="led"></span> ОНЛАЙН</div>
        </div>
        <div class="card-content">
            <div class="author-bar"><span style="font-size:0.65rem;">Ваше имя:</span><span id="currentAuthorName" style="color:#8effdb;">—</span><button class="change-author-btn" id="changeAuthorBtn">🔄 Сменить</button></div>
            <div id="chatMessages" class="chat-messages">Загрузка...</div>
            <div class="chat-input-area"><input type="text" id="chatInput" class="chat-input" placeholder="Напишите сообщение..."><button id="sendChatBtn" class="chat-send">➤</button></div>
        </div>
    </div>
</div>

<script>
    // API endpoint (ваш GitHub Pages + db.json)
    const API_BASE = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '') + '/db.json';
    
    let employees = [];
    let chatMessages = [];
    let currentChatAuthor = localStorage.getItem('epls_chat_author') || prompt("Ваше имя для чата:", "Сотрудник") || "Гость";
    localStorage.setItem('epls_chat_author', currentChatAuthor);
    document.getElementById('currentAuthorName').innerText = currentChatAuthor;

    function fetchData() {
        fetch(API_BASE)
            .then(r => r.json())
            .then(data => {
                if (data.employees) employees = data.employees;
                if (data.chat) chatMessages = data.chat.sort((a,b)=>a.timestamp-b.timestamp);
                renderTable();
                renderChat();
            })
            .catch(e => console.error('Ошибка загрузки:', e));
    }

    function saveData() {
        const payload = { employees, chat: chatMessages };
        fetch(API_BASE, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).catch(e => showToast('Ошибка сохранения', true));
    }

    function showToast(msg, isErr = false) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = isErr ? '#ff7a5e' : '#4bffc3';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function registerEmployee() {
        const full = document.getElementById('regFullname').value.trim();
        const pos = document.getElementById('regPosition').value.trim();
        const pwd = document.getElementById('regPassword').value.trim();
        if (!full || !pos || !pwd) { showToast("Заполните все поля", true); return; }
        if (employees.find(e => e.full_name === full)) { showToast("Сотрудник уже существует", true); return; }
        employees.push({
            id: Date.now().toString(),
            full_name: full,
            position: pos,
            password: pwd,
            level: 1,
            is_admin: false
        });
        saveData();
        showToast(`✅ ${full} добавлен`);
        document.getElementById('regFullname').value = '';
        document.getElementById('regPosition').value = '';
        document.getElementById('regPassword').value = '';
    }

    function updateEmployee(id, level, isAdmin) {
        const emp = employees.find(e => e.id === id);
        if (!emp) return;
        if (emp.full_name === "Системный Администратор" && isAdmin === false) {
            showToast("Нельзя снять админку с главного администратора", true);
            return;
        }
        emp.level = parseInt(level);
        emp.is_admin = isAdmin;
        saveData();
        showToast(`📌 ${emp.full_name}: уровень ${emp.level}, админ: ${isAdmin ? "ДА" : "НЕТ"}`);
    }

    function deleteEmployee(id) {
        const emp = employees.find(e => e.id === id);
        if (!emp) return;
        if (emp.full_name === "Системный Администратор") { showToast("Нельзя удалить главного администратора", true); return; }
        if (confirm(`Удалить ${emp.full_name}?`)) {
            employees = employees.filter(e => e.id !== id);
            saveData();
            showToast(`🗑️ ${emp.full_name} удалён`);
        }
    }

    function sendMessage() {
        const text = document.getElementById('chatInput').value.trim();
        if (!text) return;
        chatMessages.push({
            id: Date.now().toString(),
            author: currentChatAuthor,
            text: text,
            timestamp: Date.now()
        });
        saveData();
        document.getElementById('chatInput').value = '';
    }

    function renderTable() {
        const tbody = document.getElementById('empTableBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        employees.forEach(emp => {
            const row = tbody.insertRow();
            row.insertCell(0).innerText = emp.full_name;
            row.insertCell(1).innerHTML = `<span class="role-badge">${escapeHtml(emp.position)}</span>`;
            const lvlCell = row.insertCell(2);
            const select = document.createElement('select');
            select.className = 'level-select';
            for (let i = 1; i <= 5; i++) {
                const opt = document.createElement('option');
                opt.value = i; opt.textContent = i;
                if (emp.level === i) opt.selected = true;
                select.appendChild(opt);
            }
            const adminCell = row.insertCell(3);
            const chk = document.createElement('input');
            chk.type = 'checkbox'; chk.className = 'admin-checkbox';
            chk.checked = emp.is_admin === true;
            const actionCell = row.insertCell(4);
            const saveBtn = document.createElement('button');
            saveBtn.innerText = '💾 Сохранить';
            saveBtn.className = 'save-level-btn';
            saveBtn.onclick = () => updateEmployee(emp.id, select.value, chk.checked);
            const delBtn = document.createElement('button');
            delBtn.innerText = '🗑️ Удалить';
            delBtn.className = 'delete-btn';
            delBtn.onclick = () => deleteEmployee(emp.id);
            if (emp.full_name === "Системный Администратор") delBtn.disabled = true;
            actionCell.appendChild(saveBtn);
            actionCell.appendChild(delBtn);
            lvlCell.appendChild(select);
            adminCell.appendChild(chk);
        });
    }

    function renderChat() {
        const container = document.getElementById('chatMessages');
        if (!container) return;
        if (!chatMessages.length) { container.innerHTML = '<div>Нет сообщений</div>'; return; }
        container.innerHTML = '';
        chatMessages.forEach(msg => {
            const div = document.createElement('div');
            div.className = 'message';
            const time = new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            div.innerHTML = `<div class="author">${escapeHtml(msg.author)} <span style="color:#5a9e8a;">${time}</span></div><div class="text">${escapeHtml(msg.text)}</div>`;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    document.getElementById('registerBtn').onclick = registerEmployee;
    document.getElementById('sendChatBtn').onclick = sendMessage;
    document.getElementById('chatInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    document.getElementById('changeAuthorBtn').onclick = () => {
        const newName = prompt("Новое имя в чате:", currentChatAuthor);
        if (newName && newName.trim()) { currentChatAuthor = newName.trim(); localStorage.setItem('epls_chat_author', currentChatAuthor); document.getElementById('currentAuthorName').innerText = currentChatAuthor; showToast(`Имя изменено на ${currentChatAuthor}`); }
    };
    
    fetchData();
    setInterval(fetchData, 2000);
</script>
</body>
</html>
