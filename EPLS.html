<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EPLS | Система авторизации сотрудников</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a1f1a, #030c0f);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Courier New', 'Fira Code', 'Monaco', monospace;
            padding: 1.5rem;
            position: relative;
            animation: bgPulse 8s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { background: radial-gradient(circle at 20% 30%, #0a1f1a, #030c0f); }
            50% { background: radial-gradient(circle at 70% 60%, #0e2a24, #021010); }
        }

        /* Основной контейнер */
        .epls-container {
            max-width: 900px;
            width: 100%;
        }

        /* Терминал */
        .epuls-panel {
            width: 100%;
            background: linear-gradient(145deg, #0a191c 0%, #031113 100%);
            border-radius: 2rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(20, 130, 100, 0.25);
            backdrop-filter: blur(1px);
            border: 1px solid rgba(30, 180, 140, 0.5);
            transition: filter 0.2s;
        }

        .ep-header {
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(40, 200, 150, 0.4);
            background: rgba(0, 30, 28, 0.7);
            border-radius: 2rem 2rem 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .sys-badge {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sys-icon {
            font-size: 1.8rem;
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { filter: drop-shadow(0 0 3px #1ccfaa); transform: scale(1); }
            50% { filter: drop-shadow(0 0 10px #3effc3); transform: scale(1.05); }
        }

        .sys-title {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #b0ffea, #3dd68c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .status-led {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            background: #031e1b;
            padding: 5px 12px;
            border-radius: 30px;
            color: #adeee1;
        }

        .led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #2affb6;
            animation: blink 1s step-end infinite;
        }

        .ep-content {
            padding: 2rem;
        }

        /* Форма регистрации */
        .register-form {
            background: rgba(2, 16, 18, 0.7);
            backdrop-filter: blur(5px);
            border-radius: 1.5rem;
            padding: 1.8rem;
            border: 1px solid #1d8a73;
            margin-bottom: 2rem;
        }

        .form-title {
            font-size: 1.2rem;
            color: #3effbc;
            margin-bottom: 1.5rem;
            text-align: center;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            color: #7adbc2;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .form-group input, .form-group select {
            width: 100%;
            background: #02221f;
            border: 1px solid #2f9d80;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Courier New', monospace;
            color: #dcffee;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #7aeecb;
            box-shadow: 0 0 10px #36e0b0;
        }

        .form-group select option {
            background: #02221f;
            color: #dcffee;
        }

        .form-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .form-row .form-group {
            flex: 1;
        }

        .submit-btn {
            background: #1b7b63b3;
            border: 1px solid #5cefc2;
            padding: 12px 24px;
            border-radius: 40px;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.9rem;
            color: #f0fff5;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            background: #259e7ed9;
            box-shadow: 0 0 12px #27e6b0;
            transform: scale(1.01);
        }

        /* Список сотрудников */
        .employees-section {
            background: rgba(2, 16, 18, 0.5);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid #1d8a73;
        }

        .section-title {
            font-size: 1rem;
            color: #3effbc;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .employees-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .employee-card {
            background: #041f1bb3;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-left: 3px solid #32b894;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            transition: 0.2s;
        }

        .employee-card:hover {
            background: #06352eb3;
            transform: translateX(3px);
        }

        .employee-info {
            flex: 2;
        }

        .employee-name {
            font-weight: bold;
            color: #e1fff0;
            font-size: 0.95rem;
        }

        .employee-meta {
            display: flex;
            gap: 15px;
            font-size: 0.7rem;
            color: #7adbc2;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .employee-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .level-select {
            background: #02221f;
            border: 1px solid #2f9d80;
            padding: 5px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-family: monospace;
            color: #dcffee;
        }

        .role-select {
            background: #02221f;
            border: 1px solid #2f9d80;
            padding: 5px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-family: monospace;
            color: #dcffee;
        }

        .save-user-btn {
            background: transparent;
            border: 1px solid #2fa984;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            color: #c0f3e4;
            cursor: pointer;
            transition: 0.2s;
        }

        .save-user-btn:hover {
            background: #1b6e5a60;
            border-color: #6affcf;
        }

        .delete-user-btn {
            background: transparent;
            border: 1px solid #a9452f;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            color: #ffb7a4;
            cursor: pointer;
            transition: 0.2s;
        }

        .delete-user-btn:hover {
            background: #6e2e1b60;
            border-color: #ff7a5e;
        }

        .user-status {
            font-size: 0.6rem;
            padding: 3px 8px;
            border-radius: 20px;
            background: #0a2a25;
        }

        .status-active {
            color: #3effbc;
        }

        .empty-list {
            text-align: center;
            color: #5aa694;
            padding: 20px;
            font-size: 0.8rem;
        }

        /* Всплывающие уведомления */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #0c2628e6;
            backdrop-filter: blur(12px);
            border-left: 4px solid #4bffc3;
            border-radius: 20px;
            padding: 12px 24px;
            font-size: 0.85rem;
            color: #e1ffef;
            z-index: 1100;
            animation: slideUp 0.25s ease-out;
            text-align: center;
            white-space: nowrap;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.55rem;
            color: #2e8d74;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #031e1b;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #2e9f85;
            border-radius: 10px;
        }

        @media (max-width: 650px) {
            .ep-content { padding: 1.2rem; }
            .employee-card { flex-direction: column; align-items: stretch; }
            .employee-controls { justify-content: flex-start; }
            .toast { white-space: normal; width: 90%; text-align: center; }
        }
    </style>
</head>
<body>

<div class="epls-container">
    <div class="epuls-panel" id="eplsPanel">
        <div class="ep-header">
            <div class="sys-badge">
                <span class="sys-icon">⚡⎔</span>
                <span class="sys-title">EPLS // Управление персоналом</span>
            </div>
            <div class="status-led">
                <span class="led"></span>
                <span>СЕТЬ АКТИВНА</span>
            </div>
        </div>

        <div class="ep-content">
            <!-- Форма регистрации нового сотрудника -->
            <div class="register-form">
                <div class="form-title">🔐 РЕГИСТРАЦИЯ СОТРУДНИКА</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>ФИО</label>
                        <input type="text" id="fullName" placeholder="Иванов Иван Иванович" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>Должность</label>
                        <input type="text" id="position" placeholder="Инженер, Оператор, Аналитик..." autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label>Пароль доступа</label>
                    <input type="password" id="password" placeholder="Введите пароль" autocomplete="off">
                </div>
                <button class="submit-btn" id="registerBtn">➕ ДОБАВИТЬ В СЕТЬ</button>
            </div>

            <!-- Список сотрудников (админ-панель) -->
            <div class="employees-section">
                <div class="section-title">
                    <span>📋 СОТРУДНИКИ В СЕТИ</span>
                    <span style="font-size: 0.65rem;" id="employeeCount">0 человек</span>
                </div>
                <div class="employees-list" id="employeesList">
                    <div class="empty-list">Нет добавленных сотрудников</div>
                </div>
            </div>
        </div>

        <div class="footer">
            EPLS | Сеть сотрудников — управление уровнями допуска и должностями
        </div>
    </div>
</div>

<script>
    (function() {
        // Ключ для localStorage
        const STORAGE_KEY = 'epls_employees';

        // Загрузка сотрудников из localStorage
        let employees = [];

        function loadEmployees() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    employees = JSON.parse(saved);
                } catch(e) { employees = []; }
            }
            if (!employees.length) {
                // Демо-сотрудник для примера
                employees = [
                    {
                        id: '1',
                        fullName: 'Системный Администратор',
                        position: 'Главный инженер',
                        password: 'admin123',
                        level: 'КРИТИЧЕСКИЙ',
                        role: 'Руководитель отдела',
                        createdAt: new Date().toISOString()
                    }
                ];
                saveEmployees();
            }
            renderEmployees();
        }

        function saveEmployees() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(employees));
            updateCount();
        }

        function updateCount() {
            const countSpan = document.getElementById('employeeCount');
            if (countSpan) countSpan.innerText = employees.length + ' человек';
        }

        function showToast(message, isError = false) {
            const existing = document.querySelector('.toast');
            if(existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = isError ? '#ff7a5e' : '#4bffc3';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function addEmployee(fullName, position, password) {
            if (!fullName.trim()) {
                showToast('❌ Введите ФИО', true);
                return false;
            }
            if (!position.trim()) {
                showToast('❌ Введите должность', true);
                return false;
            }
            if (!password.trim()) {
                showToast('❌ Введите пароль', true);
                return false;
            }

            // Проверка на уникальность ФИО
            const existing = employees.find(emp => emp.fullName.toLowerCase() === fullName.trim().toLowerCase());
            if (existing) {
                showToast('❌ Сотрудник с таким ФИО уже существует', true);
                return false;
            }

            const newEmployee = {
                id: generateId(),
                fullName: fullName.trim(),
                position: position.trim(),
                password: password.trim(),
                level: 'НАЧАЛЬНЫЙ',      // Уровень допуска по умолчанию
                role: 'Сотрудник',        // Должность в иерархии
                createdAt: new Date().toISOString()
            };

            employees.push(newEmployee);
            saveEmployees();
            renderEmployees();
            showToast(`✅ ${fullName} добавлен в сеть. Уровень: НАЧАЛЬНЫЙ`);
            return true;
        }

        function deleteEmployee(id) {
            const employee = employees.find(emp => emp.id === id);
            if (employee && confirm(`Удалить сотрудника "${employee.fullName}" из сети?`)) {
                employees = employees.filter(emp => emp.id !== id);
                saveEmployees();
                renderEmployees();
                showToast(`🗑️ Сотрудник удалён`);
            }
        }

        function updateEmployee(id, newLevel, newRole) {
            const employee = employees.find(emp => emp.id === id);
            if (employee) {
                employee.level = newLevel;
                employee.role = newRole;
                saveEmployees();
                renderEmployees();
                showToast(`📌 ${employee.fullName}: уровень "${newLevel}", должность "${newRole}"`);
            }
        }

        function renderEmployees() {
            const container = document.getElementById('employeesList');
            if (!container) return;

            if (employees.length === 0) {
                container.innerHTML = '<div class="empty-list">Нет добавленных сотрудников</div>';
                updateCount();
                return;
            }

            container.innerHTML = '';
            employees.forEach(emp => {
                const card = document.createElement('div');
                card.className = 'employee-card';

                // Информация о сотруднике
                const infoDiv = document.createElement('div');
                infoDiv.className = 'employee-info';
                infoDiv.innerHTML = `
                    <div class="employee-name">${escapeHtml(emp.fullName)}</div>
                    <div class="employee-meta">
                        <span>📌 ${escapeHtml(emp.position)}</span>
                        <span>🔐 Пароль: ${'•'.repeat(Math.min(emp.password.length, 8))}</span>
                        <span>🆔 ID: ${emp.id.slice(-6)}</span>
                    </div>
                `;

                // Управление уровнями и должностями
                const controlsDiv = document.createElement('div');
                controlsDiv.className = 'employee-controls';

                // Выбор уровня допуска
                const levelSelect = document.createElement('select');
                levelSelect.className = 'level-select';
                const levels = ['НАЧАЛЬНЫЙ', 'БАЗОВЫЙ', 'ПОВЫШЕННЫЙ', 'ВЫСОКИЙ', 'КРИТИЧЕСКИЙ'];
                levels.forEach(lvl => {
                    const option = document.createElement('option');
                    option.value = lvl;
                    option.textContent = lvl;
                    if (emp.level === lvl) option.selected = true;
                    levelSelect.appendChild(option);
                });

                // Выбор должности
                const roleSelect = document.createElement('select');
                roleSelect.className = 'role-select';
                const roles = ['Сотрудник', 'Специалист', 'Ведущий специалист', 'Руководитель отдела', 'Зам. директора', 'Директор'];
                roles.forEach(rl => {
                    const option = document.createElement('option');
                    option.value = rl;
                    option.textContent = rl;
                    if (emp.role === rl) option.selected = true;
                    roleSelect.appendChild(option);
                });

                const saveBtn = document.createElement('button');
                saveBtn.className = 'save-user-btn';
                saveBtn.textContent = '💾 Сохранить';
                saveBtn.onclick = () => {
                    updateEmployee(emp.id, levelSelect.value, roleSelect.value);
                };

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-user-btn';
                deleteBtn.textContent = '🗑️ Удалить';
                deleteBtn.onclick = () => deleteEmployee(emp.id);

                controlsDiv.appendChild(levelSelect);
                controlsDiv.appendChild(roleSelect);
                controlsDiv.appendChild(saveBtn);
                controlsDiv.appendChild(deleteBtn);

                card.appendChild(infoDiv);
                card.appendChild(controlsDiv);
                container.appendChild(card);
            });

            updateCount();
        }

        // Простая защита от XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Обработка регистрации
        document.getElementById('registerBtn').addEventListener('click', () => {
            const fullName = document.getElementById('fullName').value;
            const position = document.getElementById('position').value;
            const password = document.getElementById('password').value;
            if (addEmployee(fullName, position, password)) {
                document.getElementById('fullName').value = '';
                document.getElementById('position').value = '';
                document.getElementById('password').value = '';
            }
        });

        // Добавим возможность нажать Enter
        const inputs = ['fullName', 'position', 'password'];
        inputs.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        document.getElementById('registerBtn').click();
                    }
                });
            }
        });

        // Загрузка данных при старте
        loadEmployees();
    })();
</script>
</body>
</html>
