<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EPLS | Корпоративная сеть</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a1f1a, #030c0f);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Courier New', 'Fira Code', monospace;
            padding: 1.5rem;
            animation: bgPulse 8s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { background: radial-gradient(circle at 20% 30%, #0a1f1a, #030c0f); }
            50% { background: radial-gradient(circle at 70% 60%, #0e2a24, #021010); }
        }

        .dashboard {
            max-width: 1400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: linear-gradient(145deg, #0a191c 0%, #031113 100%);
            border-radius: 1.8rem;
            border: 1px solid rgba(30, 180, 140, 0.5);
            box-shadow: 0 25px 35px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .card-header {
            padding: 1rem 1.8rem;
            background: rgba(0, 30, 28, 0.7);
            border-bottom: 1px solid rgba(40, 200, 150, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .card-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #b0ffea, #3dd68c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 1.5px;
        }

        .badge-led {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            background: #031e1b;
            padding: 4px 12px;
            border-radius: 30px;
            color: #adeee1;
        }

        .led {
            width: 9px;
            height: 9px;
            background-color: #2affb6;
            border-radius: 50%;
            animation: pulseGreen 1.5s infinite;
        }

        @keyframes pulseGreen {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .card-content {
            padding: 1.5rem 1.8rem;
        }

        .reg-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .reg-field {
            flex: 1;
            min-width: 180px;
        }

        .reg-field label {
            font-size: 0.65rem;
            color: #7adbc2;
            display: block;
            margin-bottom: 4px;
        }

        .reg-field input {
            width: 100%;
            background: #02221f;
            border: 1px solid #2f9d80;
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-family: monospace;
            color: #dcffee;
            outline: none;
        }

        .reg-field input:focus {
            border-color: #7aeecb;
            box-shadow: 0 0 8px #36e0b0;
        }

        .btn-primary {
            background: #1b7b63b3;
            border: 1px solid #5cefc2;
            padding: 10px 20px;
            border-radius: 40px;
            font-family: monospace;
            font-weight: bold;
            color: #f0fff5;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
            width: 100%;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: #259e7ed9;
            box-shadow: 0 0 12px #27e6b0;
        }

        .employees-table-wrapper {
            overflow-x: auto;
        }

        .emp-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .emp-table th, .emp-table td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid #1d6b5a;
            color: #d2f0e6;
        }

        .emp-table th {
            color: #6effcf;
            font-weight: 600;
            font-size: 0.7rem;
            letter-spacing: 1px;
        }

        .level-select {
            background: #02221f;
            border: 1px solid #2f9d80;
            padding: 6px 8px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #dcffee;
            width: 70px;
        }

        .admin-checkbox {
            transform: scale(1.1);
            accent-color: #2affb6;
            cursor: pointer;
        }

        .save-level-btn, .toggle-admin-btn {
            background: transparent;
            border: 1px solid #2fa984;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            color: #c0f3e4;
            cursor: pointer;
            margin-right: 5px;
        }

        .delete-btn {
            background: transparent;
            border: 1px solid #a9452f;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            color: #ffb7a4;
            cursor: pointer;
        }

        .role-badge {
            background: #0f2f2a;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            display: inline-block;
        }

        /* Чат */
        .chat-messages {
            height: 280px;
            overflow-y: auto;
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(2, 16, 18, 0.4);
            border-radius: 1rem;
        }

        .message {
            background: #031f1cb3;
            border-left: 3px solid #3bcba0;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 0.8rem;
        }

        .message .author {
            color: #8effdb;
            font-weight: bold;
            font-size: 0.7rem;
        }

        .message .text {
            color: #e0fff2;
            word-break: break-word;
            margin-top: 4px;
        }

        .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 0.8rem;
            border-top: 1px solid #2f7a6a;
            margin-top: 0.5rem;
        }

        .chat-input {
            flex: 1;
            background: #02221f;
            border: 1px solid #2f9d80;
            padding: 10px 12px;
            border-radius: 28px;
            font-family: monospace;
            color: #dcffee;
            outline: none;
        }

        .chat-send {
            background: #1b7b63b3;
            border: none;
            padding: 0 20px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .empty-chat {
            text-align: center;
            color: #5aa694;
            padding: 20px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #0c2628e6;
            backdrop-filter: blur(12px);
            border-left: 4px solid #4bffc3;
            border-radius: 20px;
            padding: 10px 22px;
            font-size: 0.8rem;
            color: #e1ffef;
            z-index: 1200;
            white-space: nowrap;
        }

        .footer-note {
            font-size: 0.55rem;
            text-align: center;
            color: #2e8d74;
            margin-top: 0.5rem;
        }

        .author-bar {
            display: flex;
            justify-content: flex-end;
            padding: 0 0.8rem 0.5rem;
            gap: 10px;
            align-items: center;
        }

        .change-author-btn {
            background: transparent;
            border: 1px solid #2fa984;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.6rem;
            color: #bbf0e0;
            cursor: pointer;
        }

        @media (max-width: 850px) {
            .card-content { padding: 1rem; }
            .emp-table th, .emp-table td { font-size: 0.7rem; }
            .toast { white-space: normal; width: 90%; text-align: center; }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <!-- Регистрация нового сотрудника -->
    <div class="card">
        <div class="card-header">
            <h2>🔐 РЕГИСТРАЦИЯ В СЕТИ EPLS</h2>
            <div class="badge-led"><span class="led"></span> ОТКРЫТАЯ СЕТЬ</div>
        </div>
        <div class="card-content">
            <div class="reg-grid">
                <div class="reg-field">
                    <label>ФИО</label>
                    <input type="text" id="regFullname" placeholder="Иванов Иван Иванович" autocomplete="off">
                </div>
                <div class="reg-field">
                    <label>ДОЛЖНОСТЬ (введите сами)</label>
                    <input type="text" id="regPosition" placeholder="Инженер, Оператор, Аналитик..." autocomplete="off">
                </div>
                <div class="reg-field">
                    <label>ПАРОЛЬ</label>
                    <input type="password" id="regPassword" placeholder="секретный ключ" autocomplete="off">
                </div>
            </div>
            <button class="btn-primary" id="registerBtn">➕ ДОБАВИТЬ В СЕТЬ</button>
        </div>
    </div>

    <!-- Админ-панель: список сотрудников, уровни 1-5, назначение админов -->
    <div class="card">
        <div class="card-header">
            <h2>👥 СОТРУДНИКИ | Уровни допуска 1-5</h2>
            <div class="badge-led"><span class="led"></span> АДМИН-ПАНЕЛЬ</div>
        </div>
        <div class="card-content employees-table-wrapper">
            <table class="emp-table" id="empTable">
                <thead>
                    <tr><th>ФИО</th><th>Должность</th><th>Уровень (1-5)</th><th>Админ</th><th>Действия</th></tr>
                </thead>
                <tbody id="empTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Чат -->
    <div class="card">
        <div class="card-header">
            <h2>💬 ЧАТ ЗАПРОСОВ</h2>
            <div class="badge-led"><span class="led"></span> ОНЛАЙН</div>
        </div>
        <div class="card-content">
            <div class="author-bar">
                <span style="font-size:0.65rem; color:#6bc7ae;">Ваше имя в чате:</span>
                <span id="currentAuthorName" style="color:#8effdb; font-weight:bold;">—</span>
                <button class="change-author-btn" id="changeAuthorBtn">🔄 Сменить</button>
            </div>
            <div id="chatMessages" class="chat-messages">
                <div class="empty-chat">Загрузка чата...</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" class="chat-input" placeholder="Напишите сообщение...">
                <button id="sendChatBtn" class="chat-send">➤</button>
            </div>
            <div class="footer-note">Чат видят все сотрудники. Администраторы могут назначать уровни и права.</div>
        </div>
    </div>
</div>

<script>
    // ========== ХРАНИЛИЩЕ ==========
    const STORAGE_EMPLOYEES = 'epls_network_v3';
    const STORAGE_CHAT = 'epls_chat_v3';

    let employees = [];
    let chatMessages = [];

    // ---- инициализация с демо-админом ----
    function loadData() {
        const storedEmp = localStorage.getItem(STORAGE_EMPLOYEES);
        if (storedEmp) {
            try {
                employees = JSON.parse(storedEmp);
            } catch(e) { employees = []; }
        }
        if (!employees || employees.length === 0) {
            employees = [
                { id: "admin_main", fullName: "Системный Администратор", position: "Глава сети", password: "admin123", level: 5, isAdmin: true }
            ];
            saveEmployees();
        }
        // нормализация
        employees.forEach(emp => {
            if (typeof emp.level !== 'number') emp.level = 1;
            if (emp.level < 1) emp.level = 1;
            if (emp.level > 5) emp.level = 5;
            if (emp.isAdmin === undefined) emp.isAdmin = false;
            if (!emp.position) emp.position = "Сотрудник";
        });

        const storedChat = localStorage.getItem(STORAGE_CHAT);
        if (storedChat) {
            try {
                chatMessages = JSON.parse(storedChat);
            } catch(e) { chatMessages = []; }
        }
        if (!chatMessages || chatMessages.length === 0) {
            chatMessages = [{ id: "init", author: "Система", text: "Чат активен. Пишите запросы администратору.", timestamp: Date.now() }];
            saveChat();
        }
    }

    function saveEmployees() {
        localStorage.setItem(STORAGE_EMPLOYEES, JSON.stringify(employees));
        renderEmployeesTable();
    }

    function saveChat() {
        localStorage.setItem(STORAGE_CHAT, JSON.stringify(chatMessages));
        renderChat();
    }

    function showToast(msg, isErr = false) {
        const existing = document.querySelector('.toast');
        if(existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = isErr ? '#ff7a5e' : '#4bffc3';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 500);
        }, 3000);
    }

    function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
    }

    // Регистрация: ФИО, Должность (пользовательская), пароль
    function registerEmployee(fullName, positionRaw, password) {
        if (!fullName.trim()) { showToast("❌ Введите ФИО", true); return false; }
        if (!positionRaw.trim()) { showToast("❌ Введите должность", true); return false; }
        if (!password.trim()) { showToast("❌ Введите пароль", true); return false; }
        const exists = employees.find(emp => emp.fullName.toLowerCase() === fullName.trim().toLowerCase());
        if (exists) { showToast("❌ Сотрудник с таким ФИО уже есть", true); return false; }

        const newEmp = {
            id: generateId(),
            fullName: fullName.trim(),
            position: positionRaw.trim(),      // должность, введённая пользователем
            password: password.trim(),
            level: 1,                         // начальный уровень 1
            isAdmin: false,
            registeredAt: Date.now()
        };
        employees.push(newEmp);
        saveEmployees();
        showToast(`✅ ${fullName} добавлен. Уровень допуска: 1 (администратор может повысить)`);
        return true;
    }

    function deleteEmployee(id) {
        const emp = employees.find(e => e.id === id);
        if (!emp) return;
        if (emp.fullName === "Системный Администратор" && emp.isAdmin) {
            showToast("❌ Нельзя удалить главного администратора", true);
            return;
        }
        if (confirm(`Удалить ${emp.fullName} из сети?`)) {
            employees = employees.filter(e => e.id !== id);
            saveEmployees();
            showToast(`🗑️ ${emp.fullName} удалён`);
        }
    }

    // Обновление уровня (1-5) и флага администратора
    function updateEmployee(id, newLevel, newAdminFlag) {
        const emp = employees.find(e => e.id === id);
        if (!emp) return;
        if (emp.fullName === "Системный Администратор" && emp.isAdmin && newAdminFlag === false) {
            showToast("❌ Нельзя снять админку с главного администратора", true);
            return;
        }
        let levelNum = parseInt(newLevel, 10);
        if (isNaN(levelNum)) levelNum = 1;
        levelNum = Math.min(5, Math.max(1, levelNum));
        emp.level = levelNum;
        emp.isAdmin = (newAdminFlag === true || newAdminFlag === "true");
        saveEmployees();
        showToast(`📌 ${emp.fullName}: уровень ${emp.level}, админ: ${emp.isAdmin ? "ДА" : "НЕТ"}`);
    }

    // Отрисовка таблицы
    function renderEmployeesTable() {
        const tbody = document.getElementById('empTableBody');
        if (!tbody) return;
        if (!employees.length) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center">Нет сотрудников</td></tr>`;
            return;
        }
        tbody.innerHTML = '';
        employees.forEach(emp => {
            const row = tbody.insertRow();
            // ФИО
            const cellName = row.insertCell(0);
            cellName.innerText = emp.fullName;
            // Должность (только для чтения, то что ввел пользователь)
            const cellPos = row.insertCell(1);
            cellPos.innerHTML = `<span class="role-badge">${escapeHtml(emp.position)}</span>`;
            // Уровень 1-5 select
            const cellLevel = row.insertCell(2);
            const selectLevel = document.createElement('select');
            selectLevel.className = 'level-select';
            for (let i = 1; i <= 5; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i;
                if (emp.level === i) opt.selected = true;
                selectLevel.appendChild(opt);
            }
            // Чекбокс админ
            const cellAdmin = row.insertCell(3);
            const adminCheck = document.createElement('input');
            adminCheck.type = 'checkbox';
            adminCheck.className = 'admin-checkbox';
            adminCheck.checked = emp.isAdmin === true;
            // Кнопка сохранить изменения
            const cellActions = row.insertCell(4);
            const saveBtn = document.createElement('button');
            saveBtn.innerText = '💾 Сохранить';
            saveBtn.className = 'save-level-btn';
            saveBtn.onclick = () => {
                updateEmployee(emp.id, selectLevel.value, adminCheck.checked);
            };
            const delBtn = document.createElement('button');
            delBtn.innerText = '🗑️ Удалить';
            delBtn.className = 'delete-btn';
            delBtn.onclick = () => deleteEmployee(emp.id);
            if (emp.fullName === "Системный Администратор" && emp.isAdmin) delBtn.disabled = true;
            cellActions.appendChild(saveBtn);
            cellActions.appendChild(delBtn);
            cellLevel.appendChild(selectLevel);
            cellAdmin.appendChild(adminCheck);
        });
    }

    // Чат
    function addChatMessage(author, text) {
        if (!text.trim()) return;
        const newMsg = {
            id: generateId(),
            author: author.trim(),
            text: text.trim(),
            timestamp: Date.now()
        };
        chatMessages.push(newMsg);
        if (chatMessages.length > 200) chatMessages = chatMessages.slice(-200);
        saveChat();
    }

    function renderChat() {
        const container = document.getElementById('chatMessages');
        if (!container) return;
        if (!chatMessages.length) {
            container.innerHTML = '<div class="empty-chat">Нет сообщений. Напишите запрос.</div>';
            return;
        }
        container.innerHTML = '';
        chatMessages.forEach(msg => {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            const time = new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            msgDiv.innerHTML = `<div class="author">${escapeHtml(msg.author)} <span style="color:#5a9e8a;">${time}</span></div>
                                <div class="text">${escapeHtml(msg.text)}</div>`;
            container.appendChild(msgDiv);
        });
        container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Имя в чате (храним в localStorage)
    let chatAuthor = localStorage.getItem('epls_chat_author');
    if (!chatAuthor) {
        chatAuthor = prompt("Введите ваше имя для чата (ФИО или позывной):", "Сотрудник");
        if (!chatAuthor) chatAuthor = "Гость";
        localStorage.setItem('epls_chat_author', chatAuthor);
    }
    document.getElementById('currentAuthorName').innerText = chatAuthor;

    document.getElementById('changeAuthorBtn').onclick = () => {
        const newName = prompt("Новое имя в чате:", chatAuthor);
        if (newName && newName.trim()) {
            chatAuthor = newName.trim();
            localStorage.setItem('epls_chat_author', chatAuthor);
            document.getElementById('currentAuthorName').innerText = chatAuthor;
            showToast(`Имя изменено на ${chatAuthor}`);
        }
    };

    function sendMessage() {
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (!msg) return;
        addChatMessage(chatAuthor, msg);
        input.value = '';
    }

    // === СОБЫТИЯ ===
    document.getElementById('registerBtn').addEventListener('click', () => {
        const full = document.getElementById('regFullname').value;
        const pos = document.getElementById('regPosition').value;
        const pwd = document.getElementById('regPassword').value;
        if (registerEmployee(full, pos, pwd)) {
            document.getElementById('regFullname').value = '';
            document.getElementById('regPosition').value = '';
            document.getElementById('regPassword').value = '';
        }
    });
    document.getElementById('sendChatBtn').addEventListener('click', sendMessage);
    document.getElementById('chatInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // Слушаем изменения в localStorage (синхронизация между вкладками)
    window.addEventListener('storage', (e) => {
        if (e.key === STORAGE_EMPLOYEES) {
            const newData = localStorage.getItem(STORAGE_EMPLOYEES);
            if (newData) { employees = JSON.parse(newData); renderEmployeesTable(); }
        }
        if (e.key === STORAGE_CHAT) {
            const newChat = localStorage.getItem(STORAGE_CHAT);
            if (newChat) { chatMessages = JSON.parse(newChat); renderChat(); }
        }
    });

    loadData();
    renderEmployeesTable();
    renderChat();
</script>
</body>
</html>
